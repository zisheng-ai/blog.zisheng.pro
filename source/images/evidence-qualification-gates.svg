<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">一份材料成为 Evidence 的四道资格门</title>
  <desc id="desc">原始材料依次经过 Claim Binding、Provenance、Scope and Time、Integrity 四道资格门，成为可被 Evaluation 使用的 Evidence。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111e"/><stop offset="1" stop-color="#101a2d"/></linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8093b7" stroke-opacity=".06"/></pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7186a8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/><rect width="1600" height="900" fill="url(#grid2)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="88" fill="#f4f8ff" font-size="48" font-weight="820">一份材料怎样才成为 Evidence</text>
    <text x="82" y="135" fill="#94a5c0" font-size="22">检索到、截图了、写入数据库，都不等于已经形成可验证证据</text>

    <rect x="70" y="290" width="220" height="210" rx="30" fill="#111b2a" stroke="#3c506d" stroke-width="2"/>
    <text x="180" y="348" text-anchor="middle" fill="#8296b5" font-size="16" font-weight="700">RAW MATERIAL</text>
    <text x="180" y="402" text-anchor="middle" fill="#eef3fb" font-size="30" font-weight="800">材料</text>
    <text x="180" y="444" text-anchor="middle" fill="#9aaac1" font-size="17">Log · URL · Chunk</text>
    <text x="180" y="476" text-anchor="middle" fill="#9aaac1" font-size="17">Screenshot · State</text>

    <g>
      <rect x="360" y="240" width="230" height="310" rx="28" fill="#111d2e" stroke="#4777b1" stroke-width="2"/>
      <circle cx="475" cy="302" r="29" fill="#18375b" stroke="#5da8ef"/><text x="475" y="312" text-anchor="middle" fill="#8bc5ff" font-size="26" font-weight="800">1</text>
      <text x="475" y="365" text-anchor="middle" fill="#f1f6ff" font-size="25" font-weight="800">Claim Binding</text>
      <text x="475" y="408" text-anchor="middle" fill="#9fb1ca" font-size="18">绑定具体 Claim</text>
      <text x="475" y="441" text-anchor="middle" fill="#9fb1ca" font-size="18">supports / refutes</text>
      <rect x="400" y="480" width="150" height="38" rx="12" fill="#102c43"/><text x="475" y="505" text-anchor="middle" fill="#72bffa" font-size="15">证明什么</text>

      <rect x="650" y="240" width="230" height="310" rx="28" fill="#10242b" stroke="#40bdb4" stroke-width="2"/>
      <circle cx="765" cy="302" r="29" fill="#123c3b" stroke="#4ed7cb"/><text x="765" y="312" text-anchor="middle" fill="#7ae8dd" font-size="26" font-weight="800">2</text>
      <text x="765" y="365" text-anchor="middle" fill="#f1fffd" font-size="25" font-weight="800">Provenance</text>
      <text x="765" y="408" text-anchor="middle" fill="#acd4d1" font-size="18">来源 · 采集者 · Run</text>
      <text x="765" y="441" text-anchor="middle" fill="#acd4d1" font-size="18">Snapshot · Locator</text>
      <rect x="690" y="480" width="150" height="38" rx="12" fill="#123735"/><text x="765" y="505" text-anchor="middle" fill="#69d8cd" font-size="15">从哪里来</text>

      <rect x="940" y="240" width="230" height="310" rx="28" fill="#1b2035" stroke="#7e82e8" stroke-width="2"/>
      <circle cx="1055" cy="302" r="29" fill="#292d5b" stroke="#9298ff"/><text x="1055" y="312" text-anchor="middle" fill="#bec1ff" font-size="26" font-weight="800">3</text>
      <text x="1055" y="365" text-anchor="middle" fill="#f6f6ff" font-size="25" font-weight="800">Scope &amp; Time</text>
      <text x="1055" y="408" text-anchor="middle" fill="#b7bad8" font-size="18">环境 · 版本 · 主体</text>
      <text x="1055" y="441" text-anchor="middle" fill="#b7bad8" font-size="18">validAt · expiresAt</text>
      <rect x="980" y="480" width="150" height="38" rx="12" fill="#292d50"/><text x="1055" y="505" text-anchor="middle" fill="#afb3ff" font-size="15">何时何地有效</text>

      <rect x="1230" y="240" width="230" height="310" rx="28" fill="#242031" stroke="#bc78dd" stroke-width="2"/>
      <circle cx="1345" cy="302" r="29" fill="#43274e" stroke="#d68cf4"/><text x="1345" y="312" text-anchor="middle" fill="#e5b2fa" font-size="26" font-weight="800">4</text>
      <text x="1345" y="365" text-anchor="middle" fill="#fff5ff" font-size="25" font-weight="800">Integrity</text>
      <text x="1345" y="408" text-anchor="middle" fill="#d3badb" font-size="18">Digest · Signature</text>
      <text x="1345" y="441" text-anchor="middle" fill="#d3badb" font-size="18">Immutable ID · Ledger</text>
      <rect x="1270" y="480" width="150" height="38" rx="12" fill="#3b2744"/><text x="1345" y="505" text-anchor="middle" fill="#dc9df5" font-size="15">是否被替换</text>
    </g>

    <g stroke="#7186a8" stroke-width="4" fill="none" marker-end="url(#a2)"><path d="M290 395h58"/><path d="M590 395h48"/><path d="M880 395h48"/><path d="M1170 395h48"/></g>

    <rect x="360" y="650" width="1100" height="110" rx="28" fill="#0f2d2d" stroke="#42c9bc" stroke-width="2"/>
    <text x="910" y="698" text-anchor="middle" fill="#7ee8df" font-size="19" font-weight="700">QUALIFIED EVIDENCE</text>
    <text x="910" y="738" text-anchor="middle" fill="#effffc" font-size="25" font-weight="750">可被 Verifier 复查、组合、反驳与重新计算</text>
    <path d="M1345 550v55H910v35" fill="none" stroke="#7186a8" stroke-width="4" marker-end="url(#a2)"/>
    <text x="800" y="840" text-anchor="middle" fill="#899bb5" font-size="21">没有 Claim 的 Evidence，只是 Source、Record 或 Observation</text>
  </g>
</svg>
